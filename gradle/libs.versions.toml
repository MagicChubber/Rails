# Entries for multiplatform viewmodels entered in commonMain and desktopMain resp.
jetbrains-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycleViewmodel" }
